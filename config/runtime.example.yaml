# Copy this file to config/runtime.local.yaml and change local addresses,
# credentials, and storage paths there. runtime.local.yaml is ignored by git.

service:
  host: 127.0.0.1
  port: 8100
  cors_origins:
    - "*"

clickhouse:
  host: 10.126.126.3
  port: 8123
  username: default
  password: ""
  secure: false
  factor_database: ab_factor
  model_database: ab_model

# AlphaFactorService owns model jobs, versions, events, and artifact metadata.
# Point this at the existing AlphaBlocks control database to preserve old models.
control_database:
  host: 10.126.126.3
  port: 5432
  database: alphablocks
  schema: control
  username: postgres
  password: ""
  sslmode: prefer
  connect_timeout_seconds: 5
  min_pool_size: 1
  max_pool_size: 5

sources:
  factor:
    database: ab_factor
    stock_daily_table: stock_daily_factor_source
    stock_code_column: code
    stock_date_column: trade_time
    stock_price_column: close
    stock_basic_table: stock_basic_factor_source
    stock_basic_type_column: type
    stock_basic_stock_type_value: "1"
    # Used only when a formula references an authorized stock entity-asset
    # field that is not already materialized in stock_daily_factor_source.
    entity_asset_api_base_url: http://127.0.0.1:8001/api/data-sdk
    entity_asset_query_timeout_seconds: 120
    entity_asset_query_concurrency: 2
  research:
    database: starlight

research:
  worker:
    enabled: true
  dataset:
    factor_query_chunk_days: 90
  scheduler:
    enabled: true
    refresh_seconds: 60
  # Remote GPU node configuration is managed in System Settings. Normal fields
  # are stored in PostgreSQL model_execution_nodes; SSH passwords, SSH private
  # keys and AutoDL tokens are encrypted in model_execution_node_secrets. Set
  # ALPHA_REMOTE_NODE_SECRET_KEY in the service process environment.
  storage:
    # Relative paths are resolved from the AlphaFactorService project root.
    # This root contains job datasets, trained models, predictions, MLflow files,
    # logs, manifests, and crash-recovery state.
    work_root: "./data/research"
    # Formally published models and content-addressed local dataset caches.
    model_artifacts_root: "./data/model_artifacts"
    # Generated factor-training Parquet is a local cache. Successful creation or
    # reuse refreshes its access marker; snapshots unused for 24 hours are removed.
    dataset_cache_retention_hours: 24
    dataset_cache_cleanup_interval_seconds: 3600
    # Optional durable mirror for final model bundles. The credentials file is
    # ignored by Git and should be readable only by the service account.
    object_store:
      enabled: false
      credentials_file: "./.secrets/alphablocks-s3.env"
      endpoint_url: "http://10.126.126.5:9000"
      bucket: "alphablocks-models"
      region: "us-east-1"
      prefix: "models"
      artifact_kinds:
        - bundle
        - walk_forward_series

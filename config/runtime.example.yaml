# Copy this file to config/runtime.local.yaml and change local addresses,
# credentials, and storage paths there. runtime.local.yaml is ignored by git.

service:
  host: 127.0.0.1
  port: 8100
  cors_origins:
    - "*"

clickhouse:
  host: 10.126.126.3
  port: 8123
  username: default
  password: ""
  secure: false
  factor_database: ab_factor
  model_database: ab_model

# AlphaFactorService owns model jobs, versions, events, and artifact metadata.
# Point this at the existing AlphaBlocks control database to preserve old models.
control_database:
  host: 10.126.126.3
  port: 5432
  database: alphablocks
  schema: control
  username: postgres
  password: ""
  sslmode: prefer
  connect_timeout_seconds: 5
  min_pool_size: 1
  max_pool_size: 5

sources:
  factor:
    database: ab_factor
    stock_daily_table: stock_daily_factor_source
    stock_code_column: code
    stock_date_column: trade_time
    stock_price_column: close
    stock_basic_table: stock_basic_factor_source
    stock_basic_type_column: type
    stock_basic_stock_type_value: "1"
    # Used only when a formula references an authorized stock entity-asset
    # field that is not already materialized in stock_daily_factor_source.
    entity_asset_api_base_url: http://127.0.0.1:8001/api/data-sdk
    entity_asset_query_timeout_seconds: 120
    entity_asset_query_concurrency: 4
  research:
    database: starlight

research:
  worker:
    enabled: true
  dataset:
    factor_query_chunk_days: 90
  scheduler:
    enabled: true
    refresh_seconds: 60
  # Remote GPU node metadata is managed in System Settings and stored in
  # PostgreSQL model_execution_nodes. AutoDL tokens and SSH passwords remain in
  # protected files/environment variables and are never stored in PostgreSQL.
  storage:
    # Relative paths are resolved from the AlphaFactorService project root.
    # This root contains job datasets, trained models, predictions, MLflow files,
    # logs, manifests, and crash-recovery state.
    work_root: "./data/research"
    # Immutable, formally published model artifacts managed by FactorService.
    model_artifacts_root: "./data/model_artifacts"

[project]
name = "alpha-factor-service"
version = "0.2.0"
description = "Factor, model research, inference, and signal backtest service for AlphaBlocks."
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2.8,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "clickhouse-connect>=0.7.8",
  "lightgbm>=4.5,<5",
  "numpy>=1.26,<3",
  "pandas>=1.3,<3.0",
  "pyarrow>=17,<22",
  "pyqlib>=0.9.7,<0.10",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "xgboost>=2.1,<4",
  "alphalens-reloaded>=0.4.5,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
[project.scripts]
alpha-factor-service = "factor_service.main:main"
alpha-factor-worker = "factor_service.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["factor_service", "factor_service.*"]
